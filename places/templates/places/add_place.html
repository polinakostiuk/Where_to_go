{% extends 'places/base.html' %}

{% block title %}Додати нове місце{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Додати нове улюблене місце</h2>
        <form method="post" class="mt-3">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Зберегти місце</button>
        </form>
    </div>
</div>
{% endblock %}
