{% load static %}
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Куди піти?{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'places/css/style.css' %}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">📍 Куди піти?</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'home' %}">Головна</a>
                    <a class="nav-link" href="{% url 'place_list' %}">Мої місця</a>
                    <a class="nav-link" href="{% url 'add_place' %}">Додати місце</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">Створено студенткою Костюк Поліною | {% now "Y" %} рік</p>
        </div>
    </footer>
</body>

</html>
